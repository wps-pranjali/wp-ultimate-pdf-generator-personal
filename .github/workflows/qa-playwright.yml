
name: WordPress QA Playwright

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number"
        required: true
        type: string

permissions:
  contents: read

jobs:
  qa-setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm QA trigger
        run: |
          echo "QA workflow triggered successfully"
          echo "PR Number: ${{ inputs.pr_number }}"
